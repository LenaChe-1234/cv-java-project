name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subset: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run API tests
        if: matrix.subset == 'api'
        run: mvn -B -Dtest=*ApiTests test

      - name: Run UI tests (headless)
        if: matrix.subset == 'ui'
        env:
          HEADLESS: true
        run: xvfb-run -a mvn -B -Dtest=*UiTest,*UiTests test

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: '[juice-shop.herokuapp.com](https://juice-shop.herokuapp.com)'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
